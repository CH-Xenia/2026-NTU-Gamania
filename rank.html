<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校園職涯博覽會 - 即時英雄榜 TOP 10</title>
  <style>
    :root { --main-color: #FF6600; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      background: linear-gradient(135deg, #111 0%, #222 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    }
    h1 {
      font-size: 42px; color: var(--main-color); margin: 10px 0 20px 0;
      text-shadow: 0 0 15px rgba(255, 102, 0, 0.6); letter-spacing: 2px;
    }
    .rank-card {
      width: 100%; max-width: 850px; background: rgba(42, 42, 42, 0.8);
      border-radius: 16px; border: 2px solid var(--main-color);
      box-shadow: 0 0 30px rgba(0,0,0,0.8); padding: 20px;
    }
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 22px; color: var(--main-color); border-bottom: 2px solid #444; padding: 12px; }
    td { font-size: 24px; font-weight: bold; text-align: center; padding: 14px 10px; border-bottom: 1px solid #333; }
    
    .top-1 { color: #FFD700; font-size: 28px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
    .top-2 { color: #C0C0C0; font-size: 26px; }
    .top-3 { color: #CD7F32; font-size: 26px; }

    .sync-status {
      margin-top: 15px; font-size: 14px; color: #888; display: flex; gap: 10px; align-items: center;
    }
    .dot { width: 10px; height: 10px; background: #28a745; border-radius: 50%; animation: blink 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>

  <h1>🏆 職涯挑戰賽 - 現場即時英雄榜 TOP 10</h1>
  
  <div class="rank-card">
    <table>
      <thead>
        <tr>
          <th style="width: 15%;">名次</th>
          <th style="width: 35%;">玩家暱稱</th>
          <th style="width: 25%;">福利接取數</th>
          <th style="width: 25%;">挑戰得分</th>
        </tr>
      </thead>
      <tbody id="rank-rows">
        <tr><td colspan="4" style="color: #aaa;">載入最新戰報中...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="sync-status">
    <div class="dot"></div> 即時連線中（每 3 秒自動更新）
  </div>

<script>
  // 🔗 請填入您的 GAS Web App URL 網址
  const GAS_API_URL = "https://script.google.com/macros/s/YOUR_GAS_DEPLOYMENT_ID/exec";

  function fetchTop10() {
    if (!GAS_API_URL || GAS_API_URL.includes("YOUR_GAS_DEPLOYMENT_ID")) return;

    fetch(GAS_API_URL + "?type=getRank")
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById('rank-rows');
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="color: #aaa;">尚無挑戰紀錄，快來掃碼成為第一名！</td></tr>';
          return;
        }

        data.forEach((item, index) => {
          let rankClass = '';
          let medal = index + 1;
          if (index === 0) { rankClass = 'top-1'; medal = '🥇 1'; }
          else if (index === 1) { rankClass = 'top-2'; medal = '🥈 2'; }
          else if (index === 2) { rankClass = 'top-3'; medal = '🥉 3'; }

          tbody.innerHTML += `
            <tr class="${rankClass}">
              <td>${medal}</td>
              <td>${escapeHtml(item.name)}</td>
              <td style="color:#28a745;">${item.posCount} 個</td>
              <td>${item.score} 分</td>
            </tr>
          `;
        });
      })
      .catch(err => console.warn("Fetch rank failed", err));
  }

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]; });
  }

  fetchTop10();
  setInterval(fetchTop10, 3000); // 每 3 秒動態更新一次
</script>
</body>
</html>
