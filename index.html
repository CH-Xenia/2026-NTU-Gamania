<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>校園職涯博覽會 - 接寶物遊戲</title>
  <style>
    :root {
      --main-color: #FF6600; /* Gamania 橘色系 */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background-color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 500px;
      margin: 0 auto;
      background-color: #222;
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    canvas { display: block; width: 100%; height: 100%; }
    
    .hud {
      position: absolute;
      top: 15px; left: 15px; right: 15px;
      display: flex; justify-content: space-between;
      font-size: 20px; font-weight: bold;
      color: var(--main-color);
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 5;
    }

    /* 隱藏觸發區域（角落與標題） */
    #secret-trigger {
      position: absolute; top: 0; right: 0;
      width: 60px; height: 60px;
      z-index: 50; cursor: pointer;
    }

    /* 全螢幕覆蓋彈窗 (開始畫面/排行榜/後台) */
    .screen-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 100; padding: 25px;
    }
    .modal-card {
      background: #2a2a2a; border-radius: 14px;
      width: 100%; max-width: 420px; max-height: 85vh;
      overflow-y: auto; padding: 22px;
      border: 2px solid var(--main-color);
    }
    .modal-card h2 { margin-top: 0; color: var(--main-color); font-size: 22px; text-align: center; }
    
    /* 輸入框與按鈕 */
    .input-style {
      width: 100%; padding: 12px; border-radius: 8px;
      border: 1px solid #555; background: #1a1a1a; color: #fff;
      font-size: 16px; margin: 15px 0; text-align: center;
    }
    .btn-main {
      width: 100%; padding: 12px; background: var(--main-color);
      border: none; color: white; border-radius: 8px;
      font-weight: bold; font-size: 18px; cursor: pointer;
    }
    .btn-sub {
      background: rgba(255,255,255,0.1); border: 1px solid #666;
      color: #ccc; padding: 8px 12px; border-radius: 6px;
      font-size: 13px; cursor: pointer; width: 100%; margin-top: 8px;
    }

    /* 後台表單控制 */
    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 4px; color: #ccc; }
    .form-group input, .form-group select {
      width: 100%; padding: 8px; border-radius: 4px;
      border: 1px solid #444; background: #1a1a1a; color: #fff;
    }
    
    .elem-card {
      background: #1e1e1e; border: 1px solid #444; border-radius: 8px;
      padding: 10px; margin-bottom: 10px; text-align: left;
    }
    .elem-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
    .btn-del { background: #dc3545; border: none; color: white; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
    
    /* 排行榜表格 */
    .rank-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .rank-table th, .rank-table td { padding: 10px 5px; text-align: center; border-bottom: 1px solid #444; }
    .rank-table th { color: var(--main-color); }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 右上角隱藏觸發區（連續點擊 5 下開啟後台） -->
  <div id="secret-trigger" onclick="handleSecretClick()"></div>

  <div class="hud">
    <div id="score-display">得分: 0</div>
    <div id="time-display">時間: 60s</div>
  </div>
  
  <canvas id="gameCanvas"></canvas>

  <!-- 1. 遊戲開始前：輸入名字頁面 -->
  <div id="start-screen" class="screen-overlay">
    <div class="modal-card" style="text-align: center;">
      <h2 id="welcome-title">🎮 職涯挑戰賽</h2>
      <p style="color: #ccc; font-size: 14px; margin-top: -5px;">移動底盤接取好康，避開扣分項目！</p>
      <input type="text" id="player-name-input" class="input-style" placeholder="請輸入你的名字 / 暱稱" maxlength="10">
      <button class="btn-main" onclick="confirmStartGame()">開始遊戲</button>
    </div>
  </div>

  <!-- 2. 遊戲結束：成績與排行榜頁面 -->
  <div id="end-screen" class="screen-overlay" style="display: none;">
    <div class="modal-card">
      <h2 style="margin-bottom: 5px;">🎉 遊戲結束</h2>
      <p id="final-score-text" style="text-align: center; font-size: 20px; font-weight: bold; color: var(--main-color); margin: 10px 0;"></p>
      
      <h3 style="color: #fff; font-size: 16px; text-align: center; margin-top: 15px; border-top: 1px solid #444; padding-top: 10px;">🏆 現場高分榜 (Top 5)</h3>
      <table class="rank-table">
        <thead>
          <tr><th>名次</th><th>暱稱</th><th>分數</th></tr>
        </thead>
        <tbody id="rank-tbody"></tbody>
      </table>

      <button class="btn-main" onclick="restartToStartScreen()" style="margin-top: 20px;">再玩一次 / 換下一位</button>
    </div>
  </div>

  <!-- 3. 後台密碼驗證彈窗 -->
  <div id="auth-modal" class="screen-overlay" style="display: none;">
    <div class="modal-card" style="max-width: 300px; text-align: center;">
      <h2>🔒 管理員驗證</h2>
      <input type="password" id="admin-pass-input" class="input-style" placeholder="請輸入後台密碼">
      <button class="btn-main" onclick="verifyAdminPass()">進入後台</button>
      <button class="btn-sub" onclick="closeModal('auth-modal')">取消</button>
    </div>
  </div>

  <!-- 4. 後台設定面板 -->
  <div id="admin-modal" class="screen-overlay" style="display: none;">
    <div class="modal-card">
      <h2>⚙️ 後台控制面板</h2>
      
      <div class="form-group">
        <label>遊戲時間 (秒)</label>
        <input type="number" id="cfg-time" value="60">
      </div>
      
      <div class="form-group">
        <label>掉落基礎速度 (1-10)</label>
        <input type="range" id="cfg-speed" min="1" max="10" value="4" oninput="document.getElementById('speed-val').innerText = this.value">
        <span id="speed-val" style="font-size:12px; color:var(--main-color);">4</span>
      </div>

      <div class="form-group">
        <label>主題顏色</label>
        <input type="color" id="cfg-color" value="#FF6600">
      </div>
      
      <div class="form-group">
        <label>背景圖片</label>
        <input type="file" id="cfg-bg" accept="image/*">
      </div>
      
      <div class="form-group">
        <label>接取 Logo 圖片</label>
        <input type="file" id="cfg-logo" accept="image/*">
      </div>

      <div class="form-group">
        <label>後台登入密碼</label>
        <input type="text" id="cfg-password" value="1234">
      </div>
      
      <hr style="border-color:#444; margin:15px 0;">
      <label style="color:var(--main-color); font-weight:bold;">掉落元素設定 (文字 / 圖片)</label>
      <div id="elem-list" style="margin-top:10px;"></div>
      <button type="button" class="btn-sub" onclick="addElemCard()" style="border-color:var(--main-color); color:#fff;">+ 新增掉落元素</button>

      <button class="btn-main" onclick="saveAdminConfig()" style="margin-top: 15px;">儲存設定</button>
      <button class="btn-sub" onclick="clearLeaderboard()" style="background:#dc3545; color:white; border:none; margin-top:10px;">清除排行榜資料</button>
      <button class="btn-sub
