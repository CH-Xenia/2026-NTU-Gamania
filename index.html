<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>校園職涯博覽會 - 接寶物遊戲</title>
  <style>
    :root { --main-color: #FF6600; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background-color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden; touch-action: none; color: #fff;
    }
    #game-container {
      position: relative; width: 100vw; height: 100vh;
      max-width: 500px; margin: 0 auto; background-color: #222;
      background-size: cover; background-position: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    canvas { display: block; width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }
    
    .hud {
      position: absolute;
      bottom: calc(20px + env(safe-area-inset-bottom));
      left: 15px; right: 15px;
      display: flex; justify-content: space-between;
      font-size: 18px; font-weight: bold; color: var(--main-color);
      text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
      pointer-events: none; z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 15px; border-radius: 20px;
      border: 1px solid rgba(255,102,0,0.3);
    }

    #frenzy-banner {
      position: absolute; top: 15%; width: 100%;
      text-align: center; font-size: 24px; font-weight: 900;
      color: #FFD700; text-shadow: 0 0 10px #FF6600;
      z-index: 8; display: none; pointer-events: none;
      animation: pulse 0.8s infinite alternate;
    }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.15); } }

    #big-countdown {
      position: absolute; top: 35%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 140px; font-weight: 900;
      color: rgba(255, 50, 50, 0.25);
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
      pointer-events: none; z-index: 2; display: none;
    }

    .screen-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 999; padding: 25px;
      pointer-events: auto;
    }
    .modal-card {
      background: #2a2a2a; border-radius: 14px; width: 100%;
      max-width: 420px; max-height: 85vh; overflow-y: auto; padding: 22px;
      border: 2px solid var(--main-color); pointer-events: auto;
    }
    .modal-card h2 { margin-top: 0; color: var(--main-color); font-size: 22px; text-align: center; }
    
    .input-style {
      width: 100%; padding: 12px; border-radius: 8px;
      border: 1px solid #555; background: #1a1a1a; color: #fff;
      font-size: 16px; margin: 15px 0; text-align: center; pointer-events: auto;
    }
    .btn-main {
      width: 100%; padding: 12px; background: var(--main-color);
      border: none; color: white; border-radius: 8px;
      font-weight: bold; font-size: 18px; cursor: pointer; pointer-events: auto;
    }

    .result-box {
      background: #1a1a1a; border-radius: 10px; padding: 15px; margin: 15px 0;
      border: 1px solid #444; text-align: center;
    }
    .result-row {
      display: flex; justify-content: space-between; font-size: 16px; margin: 8px 0; align-items: center;
    }
    .notice-banner {
      background: #FFD700; color: #000; font-weight: bold; padding: 12px;
      border-radius: 8px; text-align: center; font-size: 16px; margin-top: 15px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="big-countdown">10</div>
  <div id="frenzy-banner">⚡ 衝刺階段！速度加倍 ⚡</div>

  <div class="hud">
    <div id="score-display">得分: 0</div>
    <div id="time-display">時間: 30s</div>
  </div>
  
  <canvas id="gameCanvas"></canvas>

  <div id="start-screen" class="screen-overlay">
    <div class="modal-card" style="text-align: center;">
      <h2>🎮 職涯挑戰賽</h2>
      <p style="color: #ccc; font-size: 14px;">移動底盤接取好康，避開扣分項目！</p>
      <input type="text" id="player-name-input" class="input-style" placeholder="請輸入你的名字 / 暱稱" maxlength="10">
      <button class="btn-main" onclick="onClickStartGame()">開始遊戲</button>
    </div>
  </div>

  <div id="end-screen" class="screen-overlay" style="display: none;">
    <div class="modal-card">
      <h2>🎉 挑戰完成</h2>
      <p id="player-summary-title" style="text-align: center; font-size: 18px; font-weight: bold; color: var(--main-color); margin: 5px 0;"></p>
      
      <div class="result-box">
        <div class="result-row">
          <span>🎁 正確福利接取：</span>
          <span id="pos-count-text" style="color: #28a745; font-weight: bold; font-size: 18px;">0 個</span>
        </div>
        <div class="result-row">
          <span>⚠️ 錯誤項目接取：</span>
          <span id="neg-count-text" style="color: #dc3545; font-weight: bold; font-size: 18px;">0 個</span>
        </div>
        <hr style="border-color: #333; margin: 10px 0;">
        <div class="result-row">
          <span>🏆 總得分：</span>
          <span id="final-score-val" style="color: var(--main-color); font-weight: bold; font-size: 20px;">0 分</span>
        </div>
        <!-- 新增粗體顯示正確率 -->
        <div class="result-row" style="margin-top: 10px; padding-top: 8px; border-top: 1px dashed #444;">
          <span style="font-weight: bold;">🎯 答題正確率：</span>
          <span id="accuracy-rate-val" style="color: var(--main-color); font-weight: 900; font-size: 22px;">0%</span>
        </div>
      </div>

      <div class="notice-banner">
        📸 請記得截圖至兌換處換取小禮物喲！
      </div>
    </div>
  </div>
</div>

<script>
  // 🔗 請填入您的 GAS Web App 網址
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzahcQhUpPm0VjNvZvPFClLnEYXMZcrv31RS_wudN8O3XNTsgIzvjeIIqQ7uJ9A2z5a/exec";

  let canvas, ctx, audioCtx = null;

  let config = {
    gameTime: 30,
    baseSpeed: 4,
    fontSize: 18,
    bgImgData: null,
    logoImgData: null,
    elements: [
      { text: '彈性工時', score: 10, imgData: null },
      { text: '年終獎金', score: 20, imgData: null }
    ]
  };

  let currentPlayerName = '';
  let score = 0;
  let positiveCount = 0;
  let negativeCount = 0;

  let timeLeft = config.gameTime;
  let gameInterval, spawnInterval, animFrameId;
  let isGameOver = true;
  let isFrenzy = false;

  let bgImage = new Image();
  let logoImage = new Image();
  let isBgLoaded = false, isLogoLoaded = false;

  let player = { x: 0, y: 0, width: 90, height: 40 };
  let items = [];
  let floatingTexts = [];

  window.onload = function() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    player.x = canvas.width / 2 - 45;
    player.y = canvas.height - 120;

    window.addEventListener('touchmove', movePlayer, { passive: true });
    window.addEventListener('mousemove', movePlayer);

    fetchGasConfigWithTimeout();
  };

  function fetchGasConfigWithTimeout() {
    if (!GAS_API_URL || GAS_API_URL.includes("YOUR_GAS_DEPLOYMENT_ID")) return;

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 4000);

    fetch(GAS_API_URL + "?t=" + new Date().getTime(), { signal: controller.signal })
      .then(res => res.json())
      .then(data => {
        clearTimeout(timeoutId);
        if (data && data.elements && data.elements.length > 0) {
          config = data;
          timeLeft = config.gameTime || 30;
          document.getElementById('time-display').innerText = '時間: ' + timeLeft + 's';
          
          if (config.bgImgData) {
            bgImage = new Image();
            bgImage.crossOrigin = "anonymous";
            bgImage.onload = () => { isBgLoaded = true; };
            bgImage.src = config.bgImgData;
          }
          if (config.logoImgData) {
            logoImage = new Image();
            logoImage.crossOrigin = "anonymous";
            logoImage.onload = () => { isLogoLoaded = true; };
            logoImage.src = config.logoImgData;
          }
        }
      })
      .catch(err => {
        console.warn("GAS fetch timeout/error. Fallback to default.", err);
      });
  }

  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
  }

  function playSound(isPositive) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (isPositive) {
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      }
    } catch(e) {}
  }

  function movePlayer(e) {
    if (isGameOver) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const rect = canvas.getBoundingClientRect();
    player.x = clientX - rect.left - player.width / 2;
    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
  }

  function onClickStartGame() {
    initAudio();
    const input = document.getElementById('player-name-input').value.trim();
    if (!input) { alert('請輸入您的名字！'); return; }
    currentPlayerName = input;
    document.getElementById('start-screen').style.display = 'none';
    startGame();
  }

  function spawnItem() {
    if (isGameOver) return;
    const randomElem = config.elements[Math.floor(Math.random() * config.elements.length)];
    let elemImg = null;
    if (randomElem.imgData) {
      elemImg = new Image();
      elemImg.crossOrigin = "anonymous";
      elemImg.src = randomElem.imgData;
    }
    
    const speedMult = isFrenzy ? 1.5 : 1;
    items.push({
      x: Math.random() * (canvas.width - 100),
      y: -40,
      speed: ((config.baseSpeed || 4) + Math.random() * 2) * speedMult,
      data: randomElem,
      imgObj: elemImg
    });
  }

  function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (isBgLoaded && config.bgImgData) {
      ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
    }

    if (isLogoLoaded && config.logoImgData) {
      ctx.drawImage(logoImage, player.x, player.y, player.width, player.height);
    } else {
      ctx.fillStyle = '#FF6600';
      ctx.fillRect(player.x, player.y, player.width, player.height);
      ctx.fillStyle = '#FFF';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Gamania', player.x + player.width / 2, player.y + 25);
    }

    const currentFontSize = config.fontSize || 18;

    for (let i = items.length - 1; i >= 0; i--) {
      let item = items[i];
      item.y += item.speed;

      if (item.imgObj && item.imgObj.complete && item.imgObj.naturalWidth !== 0) {
        ctx.drawImage(item.imgObj, item.x, item.y, 90, 45);
      } else {
        ctx.font = `bold ${currentFontSize}px Arial`;
        const textWidth = ctx.measureText(item.data.text).width + 24;
        const boxHeight = currentFontSize + 16;

        ctx.fillStyle = item.data.score >= 0 ? '#28a745' : '#dc3545';
        ctx.fillRect(item.x, item.y, textWidth, boxHeight);
        
        ctx.fillStyle = '#FFF';
        ctx.textAlign = 'center';
        ctx.fillText(item.data.text, item.x + textWidth / 2, item.y + currentFontSize + 2);
      }

      if (
        item.y + 30 >= player.y &&
        item.x + 80 >= player.x &&
        item.x <= player.x + player.width
      ) {
        score += item.data.score;
        playSound(item.data.score >= 0);

        if (item.data.score >= 0) positiveCount++;
        else negativeCount++;
        
        floatingTexts.push({
          x: item.x + 30,
          y: player.y - 10,
          text: (item.data.score >= 0 ? '+' : '') + item.data.score,
          color: item.data.score >= 0 ? '#00FF66' : '#FF3333',
          alpha: 1.0
        });

        document.getElementById('score-display').innerText = '得分: ' + score;
        items.splice(i, 1);
        continue;
      }

      if (item.y > canvas.height) items.splice(i, 1);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      let ft = floatingTexts[i];
      ft.y -= 1.5;
      ft.alpha -= 0.025;

      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.alpha);
      ctx.fillStyle = ft.color;
      ctx.font = 'bold 22px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();

      if (ft.alpha <= 0) floatingTexts.splice(i, 1);
    }

    if (!isGameOver) animFrameId = requestAnimationFrame(update);
  }

  function startGame() {
    clearInterval(gameInterval); clearInterval(spawnInterval);
    cancelAnimationFrame(animFrameId);

    score = 0;
    positiveCount = 0;
    negativeCount = 0;

    timeLeft = config.gameTime || 30;
    items = [];
    floatingTexts = [];
    isGameOver = false;
    isFrenzy = false;

    document.getElementById('frenzy-banner').style.display = 'none';
    document.getElementById('big-countdown').style.display = 'none';
    document.getElementById('score-display').innerText = '得分: ' + score;
    document.getElementById('time-display').innerText = '時間: ' + timeLeft + 's';

    let spawnSpeed = 600;
    spawnInterval = setInterval(spawnItem, spawnSpeed);

    gameInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('time-display').innerText = '時間: ' + timeLeft + 's';

      const halfTime = Math.floor((config.gameTime || 30) / 2);
      if (timeLeft <= halfTime && !isFrenzy) {
        isFrenzy = true;
        document.getElementById('frenzy-banner').style.display = 'block';
        clearInterval(spawnInterval);
        spawnInterval = setInterval(spawnItem, 350);
      }

      const bigCount = document.getElementById('big-countdown');
      if (timeLeft <= 10 && timeLeft > 0) {
        bigCount.style.display = 'block';
        bigCount.innerText = timeLeft;
      } else {
        bigCount.style.display = 'none';
      }

      if (timeLeft <= 0) endGame();
    }, 1000);

    update();
  }

  function endGame() {
    isGameOver = true;
    clearInterval(gameInterval); clearInterval(spawnInterval);
    document.getElementById('frenzy-banner').style.display = 'none';
    document.getElementById('big-countdown').style.display = 'none';

    // 計算正確率 (正確數 / 總接數)
    const totalCaught = positiveCount + negativeCount;
    const accuracyRate = totalCaught > 0 ? Math.round((positiveCount / totalCaught) * 100) : 0;

    // 自動上傳成績至 GAS 雲端
    if (GAS_API_URL && !GAS_API_URL.includes("YOUR_GAS_DEPLOYMENT_ID")) {
      fetch(GAS_API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 
          name: currentPlayerName, 
          score: score,
          posCount: positiveCount,
          negCount: negativeCount,
          accuracy: accuracyRate
        })
      }).catch(e => console.warn("Upload score failed", e));
    }

    // 渲染結算資訊
    document.getElementById('player-summary-title').innerText = `${currentPlayerName} 的挑戰成果`;
    document.getElementById('pos-count-text').innerText = `${positiveCount} 個`;
    document.getElementById('neg-count-text').innerText = `${negativeCount} 個`;
    document.getElementById('final-score-val').innerText = `${score} 分`;
    document.getElementById('accuracy-rate-val').innerText = `${accuracyRate}%`;

    document.getElementById('end-screen').style.display = 'flex';
  }
</script>
</body>
</html>
